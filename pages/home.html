<!-- ================= HERO ================= -->
<section class="hero">
  <div class="book-box">

    <h1 class="title">
      <span class="atom-text">ATOM2K26</span>
    </h1>

    <h2 class="date">March 4 • 5 • 6 • 7</h2>

    <div class="countdown">
      <div class="time-box"><span id="days">00</span><p>Days</p></div>
      <div class="time-box"><span id="hours">00</span><p>Hours</p></div>
      <div class="time-box"><span id="minutes">00</span><p>Minutes</p></div>
      <div class="time-box"><span id="seconds">00</span><p>Seconds</p></div>
    </div>

    <a href="events.html" class="gold-btn">Explore Events</a>

  </div>
</section>

<!-- ================= JS ================= -->

<script>
function toggleMenu(){
  document.getElementById("navMenu").classList.toggle("show");
}

const eventDate = new Date("March 4, 2026 00:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const gap = eventDate - now;

  document.getElementById("days").innerText =
    Math.max(0, Math.floor(gap / (1000*60*60*24)));

  document.getElementById("hours").innerText =
    Math.max(0, Math.floor((gap % (1000*60*60*24)) / (1000*60*60)));

  document.getElementById("minutes").innerText =
    Math.max(0, Math.floor((gap % (1000*60*60)) / (1000*60)));

  document.getElementById("seconds").innerText =
    Math.max(0, Math.floor((gap % (1000*60)) / 1000));
}, 1000);
</script>

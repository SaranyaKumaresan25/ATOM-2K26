  <style>
    /* Contact Section - Harry Potter themed cards */
    .events-hero {
      padding-top: 120px; /* space for fixed navbar */
      padding-bottom: 60px;
      min-height: 80vh;
    }

    .contact-title {
      text-align: center;
      margin-bottom: 50px;
      font-size: 3rem;
      color: #d4af37;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
      letter-spacing: 3px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 10px;
    }

    .contact-card {
      background: rgba(20, 20, 50, 0.75);
      border: 2px solid #d4af37;
      border-radius: 14px;
      padding: 20px 20px;
      text-align: center;
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.6),
        inset 0 0 15px rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(6px);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(255,215,0,0.12), transparent 40%);
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
    }

    .contact-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 
        0 20px 50px rgba(212, 175, 55, 0.4),
        0 0 40px rgba(212, 175, 55, 0.25);
    }

    .contact-card:hover::before {
      opacity: 1;
    }

    .contact-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.8rem;
      color: #fff3a0;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .contact-roll {
      font-size: 1.1rem;
      color: #b8860b;
      margin-bottom: 15px;
    }

    .contact-phone {
      font-size: 1.3rem;
      color: #ffdd88;
      font-weight: 300;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contact-phone:hover {
      color: #fff3a0;
      text-shadow: 0 0 15px #ffd700;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-title { font-size: 3.2rem; }
      .contact-grid { gap: 20px; }
      .contact-card { padding: 20px 15px; }
    }
  </style>
</head>
